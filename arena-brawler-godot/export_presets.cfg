; Web-Export-Voreinstellung für Arena Brawler.
;
; Von Hand geschrieben, wie project.godot — nur das, was wirklich vom
; Standard abweicht oder für den Export entscheidend ist. Details stehen in
; README.md unter "## Web-Export (HTML5)".
;
; Export-Pfad zeigt bewusst aus diesem isolierten Godot-Projekt HERAUS in
; die Spielesammlung (../public/arena-brawler-godot/), damit Netlify die
; gebauten Web-Dateien parallel zum Phaser-Prototyp unter /arena-brawler/
; ausliefern kann. Das Godot-Projekt selbst bleibt trotzdem isoliert — es
; weiß nichts von der Sammlung, es landet nur zufällig eine Ebene höher.
;
; Threads: bewusst AUS (variant/thread_support=false). Mit Threads bräuchte
; die Seite Cross-Origin-Opener/Embedder-Policy-Header (SharedArrayBuffer-
; Pflicht) — CLAUDE.md dokumentiert unter "Zu 3-D" schon die bekannten
; WebGL-Einbrüche auf älterem iOS-Safari, und Florians Zielgeräte sind
; ausschließlich iPhone/iPad. Ohne Threads läuft es überall gleich, ohne
; Zusatz-Header, die die restliche Sammlung stören könnten. Nachgemessen:
; Ohne Threads finden sich im gebauten index.js weder "PThread" noch
; "new Worker" — der Build lädt wirklich die *_nothreads_*-Vorlage.
;
; vram_texture_compression/for_mobile bewusst NICHT aktiviert (Godot-
; Standard false bleibt bestehen) — ausprobiert und wieder verworfen:
; Diese eine Option allein lässt den Export in dieser Umgebung mit
; "Cannot export project ... due to configuration errors" scheitern (fehlt
; wohl ein Kompressions-Modul im Editor-Build). Kein Verlust: Arena Brawler
; hat keine einzige Bild-Textur, alles ist Code-Zeichnung (Polygon2D/Draw) —
; die Option hätte hier ohnehin nichts zu komprimieren.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../public/arena-brawler-godot/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
