[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Arena Brawler Mini (eigenständiger Phaser-Prototyp, siehe
# arena-brawler-mini/README.md, gespiegelt nach public/arena-brawler/) —
# eigene statische Dateien unter /arena-brawler/*, kein Teil der React-SPA.
# Echte Dateien im Bau (dist/arena-brawler/index.html, style.css, js/…)
# haben bei Netlify ohnehin Vorrang vor einem nicht erzwungenen
# Wildcard-Redirect wie dem SPA-Catch-all unten; diese Regel steht trotzdem
# explizit davor und ohne force=true, damit das im Config-File sichtbar ist
# und nicht am unausgesprochenen Standardverhalten hängt.
[[redirects]]
  from = "/arena-brawler/*"
  to = "/arena-brawler/:splat"
  status = 200

# Arena Brawler (Godot 4, eigenständiger Web-Export, siehe
# arena-brawler-godot/README.md, gebaut nach public/arena-brawler-godot/) —
# dieselbe Regel wie beim Phaser-Prototyp oben: eigene statische Dateien
# unter /arena-brawler-godot/*, kein Teil der React-SPA, kein force=true.
# Keine Cross-Origin-Opener/Embedder-Policy-Header nötig: Der Web-Export
# läuft bewusst ohne Threads (siehe export_presets.cfg), die dafür nötigen
# COOP/COEP-Header hätten sonst potenziell die restliche Sammlung gestört —
# ohne Threads braucht keine einzige Adresse einen Zusatz-Header.
[[redirects]]
  from = "/arena-brawler-godot/*"
  to = "/arena-brawler-godot/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
